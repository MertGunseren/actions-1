name: Exploring Variables and Secrets

on:
    push

Jobs:
####################### environment variables at STEP level ########################
    
    docker:
        runs-on: ubuntu-latest
        steps:
        - name: Dockerbuild
          env:
            CONTAINER_REGISTRY: docker.io 
            DOCKER_USERNAME: siddharth1
            IMAGE_NAME: github-actions-nginx
          # run: docker build -t ${{env.CONTAINER_REGISTRY}}/$DOCKER_USERNAME/$IMAGE_NAME:latest  
          run: docker build -t $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest 

        - name: Docker login
          env:
            DOCKER_USERNAME: siddharth1
            DOCKER_PASSWORD: s3cUrePaSsw0rd
          run: dcoker login --username=$DOCKER_USERNAME --password=s3cUrePaSsw0rd

        - name: Docker Publish
          env:
            CONTAINER_REGISTRY: docker.io
            DOCKER_USERNAME: siddharth1
            IMAGE_NAME: github-actions-nginx
          run: docker push $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest
    
    deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
        - name: Docker Run
          env:
            CONTAINER_REGISTRY: docker.io
            DOCKER_USERNAME: siddharth1
            IMAGE_NAME: github-actions-nginx
          run: docker run -d -p 8080:80 $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:latest